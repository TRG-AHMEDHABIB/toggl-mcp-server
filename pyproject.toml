[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toggl-mcp-trg"
version = "0.1.0"
description = "Toggl Track MCP server — log time entries from a weekly summary."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ahmed Habib" }]
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.3.0",
    # Bundles the IANA timezone database. Required for zoneinfo to work
    # in containers without system tzdata (Alpine, distroless, etc.) —
    # which is what Obot's UVX runtime uses.
    "tzdata>=2024.1",
]

[project.scripts]
toggl-mcp-trg = "toggl_mcp.__main__:main"
# Alias — the Obot server config invokes `toggl-mcp`. Kept so the gateway
# works whether it asks for the package name or the short name.
toggl-mcp = "toggl_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/toggl_mcp"]
